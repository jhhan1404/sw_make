{% extends "base.html" %}
{% block title %}문의 접수 완료{% endblock %}
{% block content %}
<div class="card card-body">
  <h1 class="h4">문의가 접수되었습니다</h1>
  <p class="mb-1">접수 번호: <strong>{{ inquiry.id }}</strong></p>
  <p class="text-muted">매장에서 확인 후 {{ inquiry.customer.phone }}(으)로 답변드립니다.</p>
  <div><a href="/" class="btn btn-outline-secondary">처음으로</a></div>
</div>
{% endblock %}
