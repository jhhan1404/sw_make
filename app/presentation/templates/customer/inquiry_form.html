{% extends "base.html" %}
{% block title %}문의하기{% endblock %}
{% block content %}
<h1 class="h4 mb-4">문의하기</h1>

{% if errors %}
<div class="alert alert-danger" role="alert">
  <ul class="mb-0">{% for e in errors %}<li>{{ e }}</li>{% endfor %}</ul>
</div>
{% endif %}

{% if not stores %}
<div class="alert alert-secondary">등록된 매장이 없습니다. 관리자에게 문의해 주세요.</div>
{% else %}
<form method="post" action="/inquiries" class="card card-body">
  <div class="mb-3">
    <label for="store_id" class="form-label">매장</label>
    <select id="store_id" name="store_id" class="form-select">
      {% for s in stores %}
      <option value="{{ s.id }}" {% if form.store_id == s.id %}selected{% endif %}>{{ s.name }}</option>
      {% endfor %}
    </select>
  </div>
  <div class="row g-3 mb-3">
    <div class="col-md-6">
      <label for="name" class="form-label">이름</label>
      <input id="name" name="name" class="form-control" maxlength="50" value="{{ form.name or '' }}" required>
    </div>
    <div class="col-md-6">
      <label for="phone" class="form-label">연락처</label>
      <input id="phone" name="phone" class="form-control" placeholder="010-1234-5678" value="{{ form.phone or '' }}" required>
    </div>
  </div>
  <div class="mb-3">
    <label for="content" class="form-label">문의 내용 <small class="text-muted">({{ "{:,}".format(max_length) }}자 이내)</small></label>
    <textarea id="content" name="content" class="form-control" rows="5" maxlength="{{ max_length }}" required>{{ form.content or '' }}</textarea>
  </div>
  <button class="btn btn-primary">문의 보내기</button>
</form>
{% endif %}
{% endblock %}
