<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}점주 관리{% endblock %} — AI 마케팅·고객응대</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <style>
    .owner-navbar { background-color: #1e3a5f; }
    .owner-navbar .navbar-brand,
    .owner-navbar .nav-link { color: rgba(255,255,255,.85) !important; }
    .owner-navbar .nav-link:hover,
    .owner-navbar .nav-link.active { color: #fff !important; }
    .owner-badge { font-size: .65rem; vertical-align: middle; }
  </style>
</head>
<body class="bg-light">
  <nav class="navbar navbar-expand owner-navbar">
    <div class="container">
      <a class="navbar-brand fw-bold" href="/owner">
        🏪 점주 관리
      </a>
      <div class="navbar-nav">
        <a class="nav-link" href="/owner">대시보드</a>
        <a class="nav-link" href="/owner/store">매장 관리</a>
        <a class="nav-link" href="/owner/reservations">예약 관리</a>
        <a class="nav-link" href="/owner/customers">고객 이력</a>
        <a class="nav-link" href="/owner/inquiries">문의함</a>
        <a class="nav-link" href="/owner/marketing">홍보 문구</a>
      </div>
    </div>
  </nav>
  <main class="container py-4">
    {% block content %}{% endblock %}
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
